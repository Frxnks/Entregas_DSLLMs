services:
  db:
    image: postgres:16-alpine
    container_name: mira-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mira_db
      POSTGRES_USER: mira_user
      POSTGRES_PASSWORD: mira_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mira-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mira_user -d mira_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mira-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: "postgresql://mira_user:mira_password@db:5432/mira_db?schema=public"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mira-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mira-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
      assistant-api:
        condition: service_started
    networks:
      - mira-network

  assistant-prepare:
    build:
      context: ./entrega3
      dockerfile: service/Dockerfile
    environment:
      RAG_EMBEDDING_MODEL: "paraphrase-multilingual-MiniLM-L12-v2"
    command: ["python", "-m", "mira_cu1.prepare"]
    volumes:
      - assistant_data:/app/entrega3/var
      - assistant_models:/root/.cache/huggingface
    networks:
      - mira-network

  assistant-mcp:
    build:
      context: ./entrega3
      dockerfile: service/Dockerfile
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: 8001
    command: ["python", "-m", "mira_cu1.mcp_server"]
    ports:
      - "8001:8001"
    volumes:
      - assistant_data:/app/entrega3/var
      - assistant_models:/root/.cache/huggingface
    depends_on:
      assistant-prepare:
        condition: service_completed_successfully
    networks:
      - mira-network

  assistant-api:
    build:
      context: ./entrega3
      dockerfile: service/Dockerfile
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: 8002
      MCP_URL: "http://assistant-mcp:8001/mcp"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
      GEMINI_FALLBACK_MODEL: "${GEMINI_FALLBACK_MODEL:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
      MIRA_CORS_ORIGIN: "http://localhost:3000"
    command: ["python", "-m", "mira_cu1.main"]
    ports:
      - "8002:8002"
    volumes:
      - assistant_data:/app/entrega3/var
      - assistant_models:/root/.cache/huggingface
    depends_on:
      assistant-prepare:
        condition: service_completed_successfully
      assistant-mcp:
        condition: service_started
    networks:
      - mira-network

networks:
  mira-network:
    name: mira-network
    driver: bridge

volumes:
  postgres_data:
    name: postgres_data
    driver: local
  assistant_data:
    name: mira_assistant_data
    driver: local
  assistant_models:
    name: mira_assistant_models
    driver: local
