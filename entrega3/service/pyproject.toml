[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-cu1"
version = "3.0.0"
description = "Asistente RAG + MCP para el operador de revisión de MIRA"
requires-python = ">=3.12,<3.14"
dependencies = [
  "chromadb>=1.3,<2",
  "fastapi>=0.115,<1",
  "fastmcp>=2.13,<4",
  "google-genai>=1.50,<2",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "optimum[onnxruntime]==1.23.3",
  "pydantic-settings>=2.6,<3",
  "sentence-transformers==3.3.1",
  "transformers>=4.44,<4.50",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2"]
report = ["reportlab>=4.2,<5", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
include = ["mira_cu1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

